<!doctype html>
<html lang="it">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Banco: card</title>
<style>
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; padding: 16px; align-items: start; }
  ha-card { display: block; background: var(--card-background-color); border-radius: 16px; box-shadow: var(--ha-card-box-shadow);
            color: var(--primary-text-color); }
</style></head>
<body>
<main id="griglia"></main>
<script type="module">
  // L'orologio del browser si ferma all'istante indicato (?ora=...), per immagini ripetibili.
  const ora = new URLSearchParams(location.search).get("ora");
  if (ora) {
    const fisso = new Date(ora).getTime();
    const Vero = Date;
    globalThis.Date = class extends Vero {
      constructor(...a) { super(...(a.length ? a : [fisso])); }
      static now() { return fisso; }
    };
  }
  const { creaHass } = await import("./hass.js");
  await import("../custom_components/foyer_raccolta_differenziata/frontend/raccolta-card.js");
  const larghezza = new URLSearchParams(location.search).get("larghezza");
  if (larghezza) document.getElementById("griglia").style.maxWidth = `${larghezza}px`;
  const hass = creaHass();
  const quali = (new URLSearchParams(location.search).get("card") ?? "oggi,settimana,mese").split(",");
  for (const nome of quali) {
    const card = document.createElement(`foyer-raccolta-${nome}-card`);
    card.setConfig({ type: `custom:foyer-raccolta-${nome}-card` });
    card.hass = hass;
    document.getElementById("griglia").append(card);
  }
  (await import("./passi.js")).esegui();
</script>
</body>
</html>
