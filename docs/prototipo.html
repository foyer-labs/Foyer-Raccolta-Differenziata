<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo Raccolta</title>
<!--
  Prototipo navigabile di pannello e card (SPEC §10, Fase 3).
  Dati finti, nessuna chiamata a Home Assistant. È il riferimento visivo dei
  componenti Lit: colori, spaziature e forme si riprendono da qui.
-->
<style>
  :root {
    --sfondo: #f3f4f6;
    --superficie: #ffffff;
    --superficie-2: #f7f8fa;
    --testo: #1b1f24;
    --testo-2: #5f6873;
    --bordo: #e3e6ea;
    --primario: #2b7a78;
    --primario-chiaro: #e3f1f0;
    --ambra: #f0a835;
    --avviso: #b45309;
    --avviso-sfondo: #fff4e0;
    --errore: #b3261e;
    --ok: #2e7d32;
    --raggio: 16px;
    --ombra: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sfondo: #111418; --superficie: #1b1f24; --superficie-2: #22272e; --testo: #e8ecf2;
      --testo-2: #9aa3ae; --bordo: #2d333b; --primario: #5fb3ae; --primario-chiaro: #1f3634;
      --avviso: #f0a835; --avviso-sfondo: #3a2c12; --ombra: none;
    }
  }
  :root[data-theme="dark"] {
    --sfondo: #111418; --superficie: #1b1f24; --superficie-2: #22272e; --testo: #e8ecf2;
    --testo-2: #9aa3ae; --bordo: #2d333b; --primario: #5fb3ae; --primario-chiaro: #1f3634;
    --avviso: #f0a835; --avviso-sfondo: #3a2c12; --ombra: none;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sfondo); color: var(--testo);
         font: 15px/1.45 Roboto, "Segoe UI", system-ui, sans-serif; }
  button { font: inherit; color: inherit; }
  .commutatore { position: fixed; right: 16px; bottom: 16px; z-index: 5; display: flex; gap: 6px; }
  .commutatore button { border: 1px solid var(--bordo); background: var(--superficie); border-radius: 999px;
                        padding: 6px 12px; cursor: pointer; box-shadow: var(--ombra); }
  .commutatore button.attivo { background: var(--primario); color: #fff; border-color: var(--primario); }

  /* --- Intestazione del pannello --- */
  .testata { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--superficie);
             border-bottom: 1px solid var(--bordo); position: sticky; top: 0; z-index: 3; }
  .testata svg { width: 32px; height: 32px; flex: none; }
  .testata h1 { font-size: 20px; margin: 0; font-weight: 500; }
  .schede { display: flex; gap: 4px; padding: 0 12px; background: var(--superficie); border-bottom: 1px solid var(--bordo);
            overflow-x: auto; position: sticky; top: 57px; z-index: 3; scrollbar-width: none; }
  .schede button { border: 0; background: none; padding: 12px 14px; cursor: pointer; color: var(--testo-2);
                   border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
  .schede button.attiva { color: var(--primario); border-bottom-color: var(--primario); }
  main { max-width: 1040px; margin: 0 auto; padding: 20px 16px 96px; }
  .griglia-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 820px) { .griglia-2 { grid-template-columns: 1fr; } }
  .riquadro { background: var(--superficie); border: 1px solid var(--bordo); border-radius: var(--raggio);
              box-shadow: var(--ombra); padding: 16px; }
  .riquadro + .riquadro { margin-top: 16px; }
  .riquadro h2 { font-size: 16px; margin: 0 0 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .riquadro h2 .conta { margin-left: auto; font-weight: 500; color: var(--testo-2); font-size: 13px; }
  .aiuto { color: var(--testo-2); font-size: 13.5px; margin: -6px 0 12px; }

  /* --- Chip di tipologia --- */
  .chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 6px;
          font-size: 13px; font-weight: 600; line-height: 20px; white-space: nowrap; }
  .chip .ico { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
               background: rgba(255,255,255,.28); font-size: 12px; }
  .pallino { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

  /* --- Panoramica --- */
  .giorno-riga { display: grid; grid-template-columns: 76px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--bordo);
                 align-items: center; }
  .giorno-riga:first-of-type { border-top: 0; }
  .giorno-riga .quando { color: var(--testo-2); font-size: 13px; line-height: 1.2; }
  .giorno-riga .quando b { display: block; color: var(--testo); font-size: 15px; }
  .giorno-riga.oggi .quando b { color: var(--primario); }
  .etichetta { font-size: 11.5px; color: var(--testo-2); margin-left: 6px; }
  .anomalia { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--avviso-sfondo);
              margin-bottom: 8px; align-items: flex-start; }
  .anomalia .testo { flex: 1; font-size: 14px; }
  .anomalia .azioni { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .anomalia.info { background: var(--superficie-2); }
  .bottone { border: 1px solid var(--bordo); background: var(--superficie); border-radius: 10px; padding: 6px 12px;
             cursor: pointer; font-weight: 500; font-size: 14px; }
  .bottone.primario { background: var(--primario); border-color: var(--primario); color: #fff; }
  .bottone.piccolo { padding: 3px 10px; font-size: 13px; border-radius: 8px; }
  .validita { display: flex; align-items: center; gap: 12px; }
  .validita .grande { font-size: 28px; font-weight: 600; }

  /* --- Tipologie --- */
  .tipologie { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .tipologia { border: 1px solid var(--bordo); border-radius: 14px; overflow: hidden; background: var(--superficie);
               display: flex; flex-direction: column; }
  .tipologia .testa { padding: 14px; color: #fff; display: flex; align-items: center; gap: 10px; }
  .tipologia .testa .cerchio { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.25);
                               display: grid; place-items: center; font-size: 18px; }
  .tipologia .testa b { font-size: 16px; }
  .tipologia .corpo { padding: 12px 14px; font-size: 13.5px; color: var(--testo-2); flex: 1; }
  .tipologia .piede { padding: 8px 14px; border-top: 1px solid var(--bordo); display: flex; justify-content: space-between;
                      font-size: 13px; }
  .nuova { border: 2px dashed var(--bordo); border-radius: 14px; display: grid; place-items: center; min-height: 150px;
           color: var(--testo-2); cursor: pointer; background: none; }

  /* --- Regole ed eccezioni --- */
  .regola { display: flex; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--bordo);
            border-radius: 12px; margin-bottom: 8px; }
  .regola .frase { flex: 1; }
  .regola .frase small { display: block; color: var(--testo-2); }
  .gruppo-tipologia { margin-bottom: 18px; }
  .gruppo-tipologia > .titolo { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 8px; }
  .badge { font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 1px 7px; text-transform: uppercase; letter-spacing: .03em; }
  .badge.aggiungi { background: #e3f4e5; color: #1b5e20; }
  .badge.togli { background: #fde7e6; color: #9b1c1c; }
  .badge.sposta { background: #e6effc; color: #1a4b9c; }

  /* --- Moduli --- */
  .modulo { display: grid; gap: 14px; }
  .campo label { display: block; font-size: 13px; color: var(--testo-2); margin-bottom: 6px; font-weight: 500; }
  .campo input, .campo select { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--bordo);
                                background: var(--superficie); color: var(--testo); font: inherit; }
  .segmenti { display: inline-flex; background: var(--superficie-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .segmenti button { border: 0; background: none; padding: 7px 12px; border-radius: 9px; cursor: pointer; font-size: 14px; }
  .segmenti button.attivo { background: var(--superficie); box-shadow: var(--ombra); font-weight: 600; }
  .giorni-sett { display: flex; gap: 6px; flex-wrap: wrap; }
  .giorni-sett button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--bordo); background: var(--superficie);
                        cursor: pointer; font-weight: 600; }
  .giorni-sett button.attivo { background: var(--primario); border-color: var(--primario); color: #fff; }
  .anteprima-date { display: flex; gap: 8px; flex-wrap: wrap; }
  .anteprima-date span { background: var(--primario-chiaro); color: var(--primario); border-radius: 8px; padding: 4px 10px;
                         font-weight: 600; font-size: 13.5px; }
  .riga-campi { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .interruttore { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0;
                  border-top: 1px solid var(--bordo); }
  .interruttore:first-of-type { border-top: 0; }
  .interruttore small { display: block; color: var(--testo-2); }
  .levetta { width: 44px; height: 26px; border-radius: 999px; background: var(--bordo); position: relative; flex: none;
             border: 0; cursor: pointer; }
  .levetta::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
                    background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
  .levetta.acceso { background: var(--primario); }
  .levetta.acceso::after { transform: translateX(18px); }

  /* --- Finestra modale di anteprima --- */
  .velo { position: fixed; inset: 0; background: rgba(10, 14, 20, .45); display: none; place-items: center; z-index: 10; padding: 16px; }
  .velo.aperto { display: grid; }
  .dialogo { background: var(--superficie); border-radius: 20px; max-width: 480px; width: 100%; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
  .dialogo h3 { margin: 0 0 4px; }
  .differenza { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--bordo); }
  .differenza .segno { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; }
  .piu { background: var(--ok); } .meno { background: var(--errore); }
  .piede-dialogo { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* ================= CARD ================= */
  .vetrina { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; align-items: start; }
  .vetrina h3 { margin: 0 0 8px; font-size: 13px; color: var(--testo-2); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
  .card { background: var(--superficie); border-radius: var(--raggio); box-shadow: var(--ombra); border: 1px solid var(--bordo);
          overflow: hidden; }
  .card .intestazione { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; }
  .card .intestazione svg { width: 26px; height: 26px; }
  .card .intestazione b { font-size: 16px; }
  .card .intestazione .sotto { margin-left: auto; color: var(--testo-2); font-size: 13px; }

  /* Oggi e domani */
  .eroe { margin: 8px 12px 12px; border-radius: 14px; padding: 16px; color: #fff; position: relative; overflow: hidden; }
  .eroe .quando { font-size: 13px; opacity: .9; font-weight: 500; letter-spacing: .02em; }
  .eroe .cosa { font-size: 26px; font-weight: 700; line-height: 1.15; margin: 4px 0 10px; }
  .eroe .fino { font-size: 13.5px; opacity: .95; display: flex; align-items: center; gap: 6px; }
  .eroe .conferma { margin-top: 14px; width: 100%; border: 0; border-radius: 12px; padding: 12px; font-weight: 700;
                    background: rgba(255,255,255,.95); color: #1b1f24; cursor: pointer; font-size: 15px; }
  .eroe .conferma.fatto { background: rgba(255,255,255,.22); color: #fff; }
  .eroe .grande-icona { position: absolute; right: -10px; top: -8px; font-size: 110px; opacity: .14; line-height: 1; }
  .fila-giorni { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--bordo); border-top: 1px solid var(--bordo); }
  .fila-giorni > div { background: var(--superficie); padding: 12px 16px; }
  .fila-giorni small { color: var(--testo-2); display: block; margin-bottom: 6px; font-weight: 500; }
  .fila-giorni .vuoto { color: var(--testo-2); font-size: 14px; }
  .banner { margin: 0 12px 12px; border-radius: 10px; padding: 8px 12px; font-size: 13px; background: var(--superficie-2);
            color: var(--testo-2); display: flex; gap: 8px; align-items: center; }
  .banner.avviso { background: var(--avviso-sfondo); color: var(--avviso); }

  /* Settimana */
  .settimana { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 8px 12px 14px; }
  .settimana .g { border-radius: 12px; padding: 8px 4px 10px; text-align: center; background: var(--superficie-2);
                  min-height: 118px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .settimana .g.oggi { background: var(--primario-chiaro); outline: 2px solid var(--primario); }
  .settimana .nome-g { font-size: 11.5px; color: var(--testo-2); text-transform: uppercase; font-weight: 600; letter-spacing: .04em; }
  .settimana .num { font-size: 18px; font-weight: 700; }
  .settimana .ico-t { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff;
                      font-size: 15px; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
  .settimana .segno-sp { font-size: 10px; color: var(--testo-2); }
  .legenda { display: flex; gap: 8px 14px; flex-wrap: wrap; padding: 0 16px 14px; font-size: 12.5px; color: var(--testo-2); }
  .legenda span { display: inline-flex; align-items: center; gap: 6px; }

  /* Mese */
  .mese-testa { display: flex; align-items: center; padding: 0 12px; gap: 8px; }
  .mese-testa b { flex: 1; text-align: center; font-size: 15px; text-transform: capitalize; }
  .mese-testa button { border: 0; background: var(--superficie-2); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 16px; }
  .mese { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; padding: 8px 12px 12px; }
  .mese .intest { text-align: center; font-size: 11px; color: var(--testo-2); font-weight: 600; padding: 4px 0; }
  .mese .c { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 3px; font-size: 13.5px; cursor: pointer; }
  .mese .c:hover { background: var(--superficie-2); }
  .mese .c.fuori { color: var(--testo-2); opacity: .45; }
  .mese .c.oggi { background: var(--primario); color: #fff; font-weight: 700; }
  .mese .c.scelto { outline: 2px solid var(--primario); }
  .mese .punti { display: flex; gap: 2px; height: 7px; }
  .mese .punti i { width: 7px; height: 7px; border-radius: 50%; }
  .mese .c.oggi .punti i { outline: 1.5px solid #fff; }
  .dettaglio { border-top: 1px solid var(--bordo); padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dettaglio small { color: var(--testo-2); width: 100%; }
  .nascosto { display: none !important; }
</style>
</head>
<body>

<div class="commutatore">
  <button data-vista="pannello" class="attivo">Pannello</button>
  <button data-vista="card">Card</button>
  <button id="tema">◐ Tema</button>
</div>

<!-- ================= PANNELLO ================= -->
<section id="pannello">
  <header class="testata">
    <span id="simbolo-testata"></span>
    <h1>Raccolta differenziata</h1>
  </header>
  <nav class="schede" id="schede"></nav>
  <main id="pagina"></main>
</section>

<!-- ================= CARD ================= -->
<section id="card" class="nascosto">
  <main>
    <div class="vetrina">
      <div><h3>Oggi e domani</h3><div id="card-oggi"></div></div>
      <div><h3>Settimana</h3><div id="card-settimana"></div></div>
      <div><h3>Mese</h3><div id="card-mese"></div></div>
    </div>
  </main>
</section>

<div class="velo" id="velo">
  <div class="dialogo">
    <h3>Prima di salvare</h3>
    <p class="aiuto" style="margin:0 0 12px">Ecco cosa cambia nei prossimi 60 giorni.</p>
    <div id="differenze"></div>
    <div class="piede-dialogo">
      <button class="bottone" data-chiudi>Annulla</button>
      <button class="bottone primario" data-chiudi>Salva</button>
    </div>
  </div>
</div>

<script>
// ------------------------------------------------------------------ dati finti
const OGGI = new Date(2026, 8, 23); // mercoledì 23 settembre 2026, sera
const TIPOLOGIE = [
  { id: "umido", nome: "Umido", colore: "#795548", icona: "🍎", note: "Scarti di cucina, fondi di caffè, gusci", giorni: [0, 3] },
  { id: "carta", nome: "Carta", colore: "#1e88e5", icona: "📰", note: "Giornali, cartone piegato. Niente scontrini.", giorni: [1], ogni: 2 },
  { id: "plastica", nome: "Plastica", colore: "#e0b400", icona: "🧴", note: "Anche lattine e tetrapak", giorni: [3] },
  { id: "vetro", nome: "Vetro", colore: "#43a047", icona: "🍾", note: "", giorni: [4], ogni: 2 },
  { id: "secco", nome: "Secco", colore: "#757575", icona: "🗑️", note: "", giorni: [4] },
  { id: "verde", nome: "Verde", colore: "#8bc34a", icona: "🍃", note: "Sfalci e potature, in fascine", giorni: [5], ogni: 2 },
];
const GIORNI = ["lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato", "domenica"];
const GIORNI_BREVI = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];
const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];

const giornoSett = (d) => (d.getDay() + 6) % 7;
const piu = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const stesso = (a, b) => a.toDateString() === b.toDateString();
const settimanaNum = (d) => Math.floor((piu(d, -giornoSett(d)) - new Date(2026, 0, 5)) / 6048e5);
function ritiriDel(d) {
  return TIPOLOGIE.filter((t) => t.giorni.includes(giornoSett(d)) && settimanaNum(d) % (t.ogni || 1) === 0);
}
const fmt = (d) => `${d.getDate()} ${MESI[d.getMonth()].slice(0, 3)}`;
const chip = (t) => `<span class="chip" style="background:${t.colore};color:${testoSu(t.colore)}"><span class="ico">${t.icona}</span>${t.nome}</span>`;
function testoSu(colore) {
  const [r, g, b] = [1, 3, 5].map((i) => parseInt(colore.slice(i, i + 2), 16) / 255);
  const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return lum > 0.55 ? "#1b1f24" : "#ffffff";
}

const SIMBOLO = (c) => `<svg viewBox="0 0 64 64" aria-hidden="true">
  <path d="M26 13.5 V9 H38 V13.5" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M10 14.5 H54" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M13.5 20 L17 57 H47 L50.5 20 Z" fill="none" stroke="${c}" stroke-width="3.2" stroke-linejoin="round"/>
  <polyline points="21,34 32,25 43,34" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
  <polyline points="25.5,40.5 32,35 38.5,40.5" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="28.5" y="46.5" width="7" height="7" fill="#F0A835"/><circle cx="32" cy="46.5" r="3.5" fill="#F0A835"/></svg>`;
const inkTema = () => getComputedStyle(document.documentElement).getPropertyValue("--testo").trim();

// ------------------------------------------------------------------ pannello
const PAGINE = {
  Panoramica: () => {
    let righe = "";
    for (let i = 0; i < 12; i++) {
      const d = piu(OGGI, i);
      const r = ritiriDel(d);
      if (!r.length) continue;
      righe += `<div class="giorno-riga ${i === 0 ? "oggi" : ""}">
        <div class="quando"><b>${i === 0 ? "Oggi" : i === 1 ? "Domani" : GIORNI_BREVI[giornoSett(d)]}</b>${fmt(d)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${r.map(chip).join("")}</div></div>`;
    }
    return `<div class="griglia-2">
      <div class="riquadro"><h2>Prossimi ritiri <span class="conta">12 giorni</span></h2>${righe}</div>
      <div>
        <div class="riquadro">
          <h2>Da controllare <span class="conta">2</span></h2>
          <div class="anomalia"><span>⚠️</span><div class="testo"><b>Carta</b> martedì 8 dicembre, Immacolata Concezione: festivo.
            <div class="azioni"><button class="bottone piccolo primario">Crea eccezione</button><button class="bottone piccolo">Ignora</button></div></div></div>
          <div class="anomalia info"><span>ℹ️</span><div class="testo"><b>Ingombranti</b> non ha ritiri nei prossimi 12 mesi.
            <div class="azioni"><button class="bottone piccolo">Aggiungi una data</button></div></div></div>
        </div>
        <div class="riquadro">
          <h2>Calendario del comune</h2>
          <div class="validita"><div class="grande">99</div><div>giorni di validità<br><small class="aiuto">fino al 31 dicembre 2026</small></div></div>
        </div>
      </div></div>`;
  },
  Tipologie: () => `<div class="riquadro"><h2>Tipologie <span class="conta">${TIPOLOGIE.length}</span></h2>
    <p class="aiuto">Una tipologia senza regole prende i ritiri solo dalle date aggiunte: va bene per gli ingombranti.</p>
    <div class="tipologie">${TIPOLOGIE.map((t) => {
      let prossimo = OGGI; while (!ritiriDel(prossimo).includes(t)) prossimo = piu(prossimo, 1);
      return `<div class="tipologia"><div class="testa" style="background:${t.colore};color:${testoSu(t.colore)}"><span class="cerchio">${t.icona}</span><b>${t.nome}</b></div>
      <div class="corpo">${t.note || "<i>Nessuna nota</i>"}</div>
      <div class="piede"><span>Prossimo: <b>${fmt(prossimo)}</b></span><a href="#" style="color:var(--primario)">Modifica</a></div></div>`;
    }).join("")}<button class="nuova">＋ Nuova tipologia</button></div></div>`,
  Regole: () => `<div class="griglia-2"><div class="riquadro"><h2>Regole</h2>
      ${TIPOLOGIE.slice(0, 4).map((t) => `<div class="gruppo-tipologia"><div class="titolo"><span class="pallino" style="background:${t.colore}"></span>${t.nome}</div>
        <div class="regola"><div class="frase">${t.ogni === 2 ? "Una settimana sì e una no" : "Ogni settimana"}, ${t.giorni.map((g) => "il " + GIORNI[g]).join(" e ")}
        <small>${t.id === "verde" ? "Dal 1° aprile al 31 ottobre, ogni anno" : "Tutto l'anno"}</small></div><button class="bottone piccolo">Modifica</button></div></div>`).join("")}
      <button class="bottone primario">＋ Nuova regola</button></div>
    <div class="riquadro"><h2>Nuova regola · Carta</h2><div class="modulo">
      <div class="campo"><label>Ricorrenza</label><div class="segmenti"><button class="attivo">Ogni N settimane</button><button>N-esimo giorno del mese</button><button>Giorno del mese</button></div></div>
      <div class="campo"><label>Ogni</label><div class="segmenti"><button>1 settimana</button><button class="attivo">2 settimane</button><button>3</button><button>4</button></div></div>
      <div class="campo"><label>Nei giorni</label><div class="giorni-sett">${GIORNI_BREVI.map((g, i) => `<button class="${i === 1 ? "attivo" : ""}">${g.slice(0, 2)}</button>`).join("")}</div></div>
      <div class="campo"><label>Un giorno in cui questo ritiro c'è stato o ci sarà</label><input type="date" value="2026-09-22"></div>
      <div class="campo"><label>Periodo</label><div class="segmenti"><button class="attivo">Tutto l'anno</button><button>Ogni anno dal… al…</button><button>Solo dal… al… (con anno)</button></div></div>
      <div class="campo"><label>Le prossime date</label><div class="anteprima-date"><span>mar 6 ott</span><span>mar 20 ott</span><span>mar 3 nov</span><span>mar 17 nov</span></div></div>
      <div><button class="bottone primario" data-anteprima>Salva regola</button></div></div></div></div>`,
  Eccezioni: () => `<div class="riquadro"><h2>Eccezioni <span class="conta">3</span></h2>
    <p class="aiuto">Le date che il calendario del comune cambia: un ritiro in più, uno annullato, uno spostato.</p>
    ${[["sposta", "carta", "Ven 25 dic → Dom 27 dic", "Natale"], ["togli", "umido", "Gio 1 gen", "Capodanno"], ["aggiungi", "verde", "Sab 14 nov", "Passaggio straordinario"]].map(([tipo, id, quando, nota]) => {
      const t = TIPOLOGIE.find((x) => x.id === id);
      return `<div class="regola"><span class="badge ${tipo}">${tipo}</span>${chip(t)}<div class="frase"><b>${quando}</b><small>${nota}</small></div><button class="bottone piccolo">Modifica</button></div>`;
    }).join("")}
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="bottone primario">＋ Aggiungi un ritiro</button><button class="bottone">Togli un ritiro</button><button class="bottone">Sposta un ritiro</button></div></div>`,
  Promemoria: () => `<div class="griglia-2"><div>
      <div class="riquadro"><h2>Promemoria</h2>
        <div class="regola"><div class="frase"><b>La sera prima</b> alle 20:30<small>Tutte le tipologie · 2 telefoni</small></div><button class="levetta acceso" aria-label="Attivo"></button></div>
        <div class="regola"><div class="frase"><b>Vetro, due giorni prima</b> alle 19:00<small>Vetro · 1 telefono</small></div><button class="levetta acceso" aria-label="Attivo"></button></div>
        <button class="bottone primario">＋ Nuovo promemoria</button></div>
      <div class="riquadro"><h2>Solleciti</h2>
        <div class="interruttore"><div>Sollecita se non confermo<small>Ripete il promemoria finché qualcuno non tocca «Esposto ✓». Alla maggior parte delle persone basta la notifica.</small></div><button class="levetta" aria-label="Spento"></button></div></div></div>
      <div><div class="riquadro"><h2>Quando si espongono i sacchi</h2><div class="modulo">
        <div class="riga-campi"><div class="campo"><label>Dalle</label><input type="time" value="20:00"></div><div class="campo"><label>del</label><select><option>giorno prima</option><option>giorno stesso</option></select></div></div>
        <div class="campo"><label>Entro le (giorno del ritiro)</label><input type="time" value="06:00"></div></div></div>
      <div class="riquadro"><h2>Vacanze</h2><p class="aiuto">Nelle date indicate i promemoria tacciono; il calendario resta.</p>
        <div class="regola"><div class="frase"><b>8 → 23 agosto 2027</b><small>Tra 319 giorni</small></div><button class="bottone piccolo">Togli</button></div>
        <button class="bottone">＋ Aggiungi vacanza</button></div></div></div>`,
  Impostazioni: () => `<div class="riquadro" style="max-width:640px"><h2>Impostazioni</h2>
      <div class="interruttore"><div>Mostra nella barra laterale<small>Se la nascondi, trovi il pannello nella pagina del dispositivo «Raccolta differenziata».</small></div><button class="levetta acceso"></button></div>
      <div class="interruttore"><div>Calendario valido fino al<small>Un mese prima ti ricordiamo di controllare quello nuovo del comune.</small></div><input type="date" value="2026-12-31" style="padding:8px;border-radius:10px;border:1px solid var(--bordo);background:var(--superficie);color:var(--testo)"></div>
      <div class="interruttore"><div>Santo patrono<small>Segnalato come festivo, come le feste nazionali.</small></div><span>Sant'Ambrogio · 7 dic</span></div></div>`,
};

function mostraPagina(nome) {
  document.getElementById("schede").innerHTML = Object.keys(PAGINE)
    .map((p) => `<button class="${p === nome ? "attiva" : ""}" data-pagina="${p}">${p}</button>`).join("");
  document.getElementById("pagina").innerHTML = PAGINE[nome]();
}

// ------------------------------------------------------------------ card
function cardOggi() {
  const domani = piu(OGGI, 1);
  const r = ritiriDel(domani);
  const principale = r[0];
  return `<div class="card">
    <div class="intestazione">${SIMBOLO(inkTema())}<b>Raccolta</b><span class="sotto">mercoledì 23 settembre</span></div>
    <div class="eroe" style="background:linear-gradient(135deg, ${principale.colore}, ${r[1] ? r[1].colore : principale.colore})">
      <span class="grande-icona">${principale.icona}</span>
      <div class="quando">STASERA FUORI</div>
      <div class="cosa">${r.map((t) => t.nome).join(" e ")}</div>
      <div class="fino">⏱ entro le 06:00 di domani</div>
      <button class="conferma" id="esposto">Esposto ✓</button>
    </div>
    <div class="fila-giorni"><div><small>Oggi</small><span class="vuoto">Nessun ritiro</span></div>
      <div><small>Venerdì</small>${ritiriDel(piu(OGGI, 2)).map(chip).join(" ") || '<span class="vuoto">Nessuno</span>'}</div></div>
  </div>`;
}
function cardSettimana() {
  let celle = "";
  for (let i = 0; i < 7; i++) {
    const d = piu(OGGI, i);
    const r = ritiriDel(d);
    celle += `<div class="g ${i === 0 ? "oggi" : ""}"><span class="nome-g">${i === 0 ? "Oggi" : GIORNI_BREVI[giornoSett(d)]}</span><span class="num">${d.getDate()}</span>
      ${r.map((t) => `<span class="ico-t" title="${t.nome}" style="background:${t.colore}">${t.icona}</span>`).join("")}</div>`;
  }
  const usate = TIPOLOGIE.filter((t) => [...Array(7)].some((_, i) => ritiriDel(piu(OGGI, i)).includes(t)));
  return `<div class="card"><div class="intestazione">${SIMBOLO(inkTema())}<b>Questa settimana</b><span class="sotto">23–29 set</span></div>
    <div class="settimana">${celle}</div>
    <div class="legenda">${usate.map((t) => `<span><i class="pallino" style="background:${t.colore}"></i>${t.nome}</span>`).join("")}</div>
    <div class="banner">🔕 Promemoria sospesi dall'8 al 23 agosto</div></div>`;
}
let meseScelto = OGGI;
function cardMese() {
  const primo = new Date(OGGI.getFullYear(), OGGI.getMonth(), 1);
  let celle = GIORNI_BREVI.map((g) => `<div class="intest">${g.slice(0, 1)}</div>`).join("");
  for (let i = -giornoSett(primo); i < 42 - giornoSett(primo); i++) {
    const d = piu(primo, i);
    if (i >= 35 - giornoSett(primo) && d.getMonth() !== OGGI.getMonth()) break;
    const r = ritiriDel(d);
    celle += `<div class="c ${d.getMonth() !== OGGI.getMonth() ? "fuori" : ""} ${stesso(d, OGGI) ? "oggi" : ""} ${stesso(d, meseScelto) && !stesso(d, OGGI) ? "scelto" : ""}" data-giorno="${d.toISOString()}">
      ${d.getDate()}<span class="punti">${r.slice(0, 3).map((t) => `<i style="background:${t.colore}"></i>`).join("")}</span></div>`;
  }
  const r = ritiriDel(meseScelto);
  return `<div class="card"><div class="intestazione">${SIMBOLO(inkTema())}<b>Calendario</b></div>
    <div class="mese-testa"><button aria-label="Mese precedente">‹</button><b>${MESI[OGGI.getMonth()]} ${OGGI.getFullYear()}</b><button aria-label="Mese successivo">›</button></div>
    <div class="mese" id="griglia-mese">${celle}</div>
    <div class="dettaglio"><small>${GIORNI[giornoSett(meseScelto)]} ${fmt(meseScelto)}</small>${r.map(chip).join("") || "<span class='aiuto' style='margin:0'>Nessun ritiro</span>"}
      ${r[0] && r[0].note ? `<small>${r[0].note}</small>` : ""}</div></div>`;
}
function mostraCard() {
  document.getElementById("card-oggi").innerHTML = cardOggi();
  document.getElementById("card-settimana").innerHTML = cardSettimana();
  document.getElementById("card-mese").innerHTML = cardMese();
  document.getElementById("simbolo-testata").innerHTML = SIMBOLO(inkTema());
}

// ------------------------------------------------------------------ interazioni
document.addEventListener("click", (e) => {
  const b = e.target.closest("button, [data-giorno]");
  if (!b) return;
  if (b.dataset.pagina) mostraPagina(b.dataset.pagina);
  if (b.dataset.vista) {
    document.querySelectorAll("[data-vista]").forEach((x) => x.classList.toggle("attivo", x === b));
    document.getElementById("pannello").classList.toggle("nascosto", b.dataset.vista !== "pannello");
    document.getElementById("card").classList.toggle("nascosto", b.dataset.vista !== "card");
  }
  if (b.id === "tema") {
    const r = document.documentElement;
    const scuro = r.dataset.theme ? r.dataset.theme !== "dark" : !matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = scuro ? "dark" : "light";
    mostraCard();
  }
  if (b.classList.contains("levetta")) b.classList.toggle("acceso");
  if (b.closest(".segmenti")) { b.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("attivo", x === b)); }
  if (b.closest(".giorni-sett")) b.classList.toggle("attivo");
  if (b.id === "esposto") { b.classList.toggle("fatto"); b.textContent = b.classList.contains("fatto") ? "✓ Esposto alle 21:04 · annulla" : "Esposto ✓"; }
  if (b.dataset.giorno) { meseScelto = new Date(b.dataset.giorno); document.getElementById("card-mese").innerHTML = cardMese(); }
  if (b.hasAttribute("data-anteprima")) {
    document.getElementById("differenze").innerHTML = [["+", "mar 6 ottobre", "Carta"], ["−", "mar 29 settembre", "Carta"], ["+", "mar 20 ottobre", "Carta"], ["−", "mar 13 ottobre", "Carta"]]
      .map(([s, q, n]) => `<div class="differenza"><span class="segno ${s === "+" ? "piu" : "meno"}">${s}</span><b>${q}</b>${chip(TIPOLOGIE[1])}</div>`).join("");
    document.getElementById("velo").classList.add("aperto");
  }
  if (b.hasAttribute("data-chiudi")) document.getElementById("velo").classList.remove("aperto");
});
mostraPagina(new URLSearchParams(location.search).get("pagina") || "Panoramica");
if (new URLSearchParams(location.search).get("vista") === "card") document.querySelector('[data-vista="card"]').click();
mostraCard();
</script>
</body>
</html>
