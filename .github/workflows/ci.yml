name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: validazione HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  pura:
    # La suite pura, apposta SENZA Home Assistant installato: se core/ ne avesse
    # bisogno, questi test non riuscirebbero nemmeno a importare (INV-1). Copre
    # anche il confronto delle traduzioni (SPEC §12).
    name: pytest puro (py${{ matrix.python }}, senza Home Assistant)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # hypothesis per i test di proprietà del motore (SPEC §7).
      - run: pip install pytest hypothesis
      - name: Home Assistant non deve essere importabile qui
        run: "! python -c 'import homeassistant'"
      - run: pytest

  integrazione:
    name: pytest integrazione (${{ matrix.nome }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # La versione minima dichiarata in hacs.json (decisione 24).
          - nome: HA 2026.6
            python: "3.14"
            pacchetti: pytest-homeassistant-custom-component==0.13.336
          # L'ultima versione di Home Assistant, per sapere presto se qualcosa si rompe.
          - nome: HA ultima
            python: "3.14"
            pacchetti: pytest-homeassistant-custom-component
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          # I pacchetti di test di Home Assistant sono quasi tutto il tempo del job:
          # si tengono tra un'esecuzione e l'altra. La chiave è questo file, così un
          # cambio di versione riparte da capo.
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      # openpyxl è un requisito del manifest: Home Assistant lo installa da solo, i
      # test no.
      - run: pip install ${{ matrix.pacchetti }} pytest-xdist openpyxl==3.1.5
      # L'integrazione dipende da frontend: serve il pacchetto del frontend alla
      # versione che quella Home Assistant fissa nel suo manifest.
      - name: Installa il frontend fissato da quella Home Assistant
        run: |
          pip install "$(python - <<'EOF'
          import json, pathlib, homeassistant.components.frontend as f
          manifest = pathlib.Path(f.__file__).with_name("manifest.json")
          print(json.loads(manifest.read_text())["requirements"][0])
          EOF
          )"
      - run: >
          pytest -p pytest_homeassistant_custom_component
          -o asyncio_mode=auto -o asyncio_default_fixture_loop_scope=function
          -n auto tests/integrazione

  frontend:
    name: build del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # HACS installa l'integrazione così com'è: i file costruiti sono nel
      # repository e devono corrispondere ai sorgenti.
      - name: I file costruiti corrispondono ai sorgenti
        run: git diff --exit-code custom_components/foyer_raccolta_differenziata/frontend
