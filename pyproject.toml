[project]
name = "foyer-raccolta-differenziata"
version = "0.2.0"
description = "Il calendario della raccolta differenziata per Home Assistant"
license = "Apache-2.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
# L'esecuzione predefinita è la suite pura: non serve Home Assistant. I test in
# tests/integrazione girano in un job a parte con pytest-homeassistant-custom-component.
testpaths = ["tests/core", "tests/repo"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ASYNC"]
ignore = [
    "PLR2004",  # i valori letterali sono normali nei test
    "PLC0415",  # __init__.py importa Home Assistant dentro le funzioni, apposta (INV-1)
    "PLR0913",
    "RUF001",   # testo italiano: apostrofi e virgolette tipografiche sono voluti
    "RUF002",
    "RUF003",
    # Un validatore è un elenco piatto di controlli indipendenti e `decidi` un elenco
    # di regole dei promemoria: spezzarli per il conto dei rami sparpaglierebbe
    # regole che si verificano meglio una accanto all'altra.
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
# Le tabelle di casi dei test restano una riga per caso, anche se lunghe.
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
